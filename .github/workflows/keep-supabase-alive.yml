name: Mantener Activo Supabase

on:
  schedule:
    # Se ejecuta automáticamente cada 5 días a las 3:00 AM UTC
    - cron: '0 3 */5 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando tú quieras para probarlo

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Realizar petición de control a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/invernaderos?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          
          echo "Código de respuesta HTTP de Supabase: $RESPONSE"
          
          if [ "$RESPONSE" -eq 200 ]; then
            echo "¡Éxito! Supabase se ha mantenido activo correctamente."
          else
            echo "Aviso: La respuesta HTTP fue $RESPONSE"
            exit 1
          fi
